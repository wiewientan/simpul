version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: simpul-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simpul_db
      MYSQL_USER: simpul_user
      MYSQL_PASSWORD: simpulpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simpul-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MYSQL_HOST: mysql-db
      MYSQL_USER: simpul_user
      MYSQL_PASSWORD: simpulpassword
      MYSQL_DATABASE: simpul_db
    depends_on:
      - mysql-db

  frontend-react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simpul-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  mysql_data:
